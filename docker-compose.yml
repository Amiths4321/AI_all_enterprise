services:
  enterprise-rag:
    build: .
    container_name: enterprise-rag
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      OLLAMA_URL: http://10.22.39.192:11434
      OLLAMA_MODEL: qwen2.5vl:latest
      CHROMA_PATH: /app/chroma_db
      CHROMA_COLLECTION: enterprise_documents
      RETRIEVAL_TOP_K: 10
      RERANKING_TOP_N: 3
      REQUEST_TIMEOUT: 120
    volumes:
      - ./chroma_db:/app/chroma_db